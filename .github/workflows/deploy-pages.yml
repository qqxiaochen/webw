name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 镜像模式：仅部署到 *.github.io，保留 Cloudflare 上的 www.paomfz.com
      # 移除 CNAME 文件，避免 GitHub Pages 尝试绑定自定义域名
      - name: Exclude custom domain (mirror on github.io only)
        run: rm -f CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点文件在仓库根目录
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
